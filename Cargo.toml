[package]
name = "longbridge-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
log = "0.4"
simplelog = "0.12"
rand = "0.8"
chrono = "0.4"

[[bin]]
name = "longbridge"
path = "src/main.rs"

# GPUI Examples
[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "drag_drop"
path = "examples/drag_drop.rs"

[[example]]
name = "gradient"
path = "examples/gradient.rs"

[[example]]
name = "grid_layout"
path = "examples/grid_layout.rs"

[[example]]
name = "pattern"
path = "examples/pattern.rs"

[[example]]
name = "scrollable"
path = "examples/scrollable.rs"

[[example]]
name = "uniform_list"
path = "examples/uniform_list.rs"

[[example]]
name = "text_wrapper"
path = "examples/text_wrapper.rs"
